<section class="auth-flow d-flex flex-column w-100">
  <form
    class="auth-card d-flex flex-column w-100"
    [formGroup]="forgotPasswordForm"
    (ngSubmit)="submit()"
    novalidate
  >
    <label class="field form-label mb-0">
      <span>Email address</span>
      <span
        class="input-shell d-flex align-items-center w-100"
        [class.input-invalid]="isEmailInvalid"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6h16v12H4z" />
          <path d="m4 7 8 6 8-6" />
        </svg>
        <input
          class="form-control border-0 shadow-none p-0"
          formControlName="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          [attr.aria-invalid]="isEmailInvalid"
        />
      </span>
      @if (isEmailInvalid) {
        <span class="invalid-feedback d-block">
          @if (forgotPasswordForm.controls.email.hasError('required')) {
            Email address is required.
          } @else {
            Enter a valid email address.
          }
        </span>
      }
    </label>

    <button class="primary-btn btn w-100" type="submit">Send reset link</button>
  </form>
</section>
