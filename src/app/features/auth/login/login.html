<section class="auth-flow d-flex flex-column w-100">
  <form
    class="auth-card d-flex flex-column w-100"
    [formGroup]="loginForm"
    (ngSubmit)="submit()"
    novalidate
  >
    <label class="field form-label mb-0">
      <span>Email</span>
      <mat-form-field
        class="auth-mat-field"
        appearance="outline"
        subscriptSizing="dynamic"
        [class.input-invalid]="isInvalid('email')"
      >
        <mat-icon matPrefix>mail</mat-icon>
        <input
          matInput
          formControlName="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          [attr.aria-invalid]="isInvalid('email')"
        />
      </mat-form-field>
      @if (isInvalid('email')) {
        <span class="invalid-feedback d-block">
          @if (loginForm.controls.email.hasError('required')) {
            Email is required.
          } @else {
            Enter a valid email address.
          }
        </span>
      }
    </label>

    <label class="field form-label mb-0">
      <span>Password</span>
      <mat-form-field
        class="auth-mat-field"
        appearance="outline"
        subscriptSizing="dynamic"
        [class.input-invalid]="isInvalid('password')"
      >
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          formControlName="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          placeholder="••••••••"
          autocomplete="current-password"
          [attr.aria-invalid]="isInvalid('password')"
        />
        <button
          class="input-action"
          matSuffix
          type="button"
          [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="passwordVisible()"
          (click)="togglePasswordVisibility()"
        >
          <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      @if (isInvalid('password')) {
        <span class="invalid-feedback d-block">
          @if (loginForm.controls.password.hasError('required')) {
            Password is required.
          } @else {
            Password must contain at least 8 characters.
          }
        </span>
      }
    </label>

    <a class="forgot-link align-self-end text-decoration-none" routerLink="/auth/forgot-password">Forgot password?</a>

    <button class="primary-btn btn w-100" type="submit">Sign in</button>
  </form>
</section>
