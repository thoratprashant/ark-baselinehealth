<main class="auth-layout container-fluid p-0">
  <span class="ambient ambient-primary" aria-hidden="true"></span>
  <span class="ambient ambient-secondary" aria-hidden="true"></span>
  <span class="ambient ambient-tertiary" aria-hidden="true"></span>

  <section class="brand-pane d-flex align-items-center justify-content-center" aria-label="Baseline Health">
    <div class="brand-wrap d-flex flex-column align-items-center text-center">
      <img class="auth-logo img-fluid" src="assets/images/auth-logo.svg" alt="Baseline Health" />

      <div class="auth-intro d-flex flex-column align-items-center">
        <div class="heading-icon d-inline-flex align-items-center justify-content-center" aria-hidden="true">
          @if (page().icon === 'mail') {
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16v12H4z" />
              <path d="m4 7 8 6 8-6" />
            </svg>
          } @else if (page().icon === 'lock') {
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="10" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              <path d="M12 14v2" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24">
              <path d="M10 7l5 5-5 5" />
              <path d="M15 12H3" />
              <path d="M14 4h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4" />
            </svg>
          }
        </div>

        <h1>{{ page().title }}</h1>
        <p>{{ page().subtitle }}</p>

        <a class="intro-link d-inline-flex align-items-center text-decoration-none" [routerLink]="page().link">
          @if (page().showBackArrow) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5" />
              <path d="m12 19-7-7 7-7" />
            </svg>
          }
          <span>{{ page().linkPrefix }}</span>
          <strong>{{ page().linkLabel }}</strong>
        </a>
      </div>
    </div>
  </section>

  <section class="form-pane d-flex flex-column align-items-center justify-content-center route--wrapper">
    <router-outlet />
    @if (page().key !== 'registration') {
      <p class="security-note mb-0 text-center">Protected by HIPAA-compliant security</p>
    }
  </section>
</main>
