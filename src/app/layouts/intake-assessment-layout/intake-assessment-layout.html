<div class="intake-shell d-flex flex-column overflow-hidden">
  <header class="intake-header d-grid flex-shrink-0 align-items-center">
    <a
      class="intake-brand d-block"
      routerLink="/intake-assessment"
      aria-label="Baseline Health home"
    >
      <img class="d-block h-100 w-100" src="assets/images/auth-logo.svg" alt="Baseline Health" />
    </a>

    <!-- <div class="security-chip d-none align-items-center gap-2 d-sm-flex">
      <span class="security-chip__dot" aria-hidden="true"></span>
      <span>HIPAA secure · auto-saved</span>
    </div> -->

    <a class="save-exit" routerLink="/auth/login">Save &amp; exit</a>
  </header>

  <main class="intake-main d-flex flex-column overflow-hidden">
    @if (flow.currentIndex() > 0 && !flow.isComplete()) {
      <section
        class="assessment-progress d-grid flex-shrink-0 gap-2 mb-2"
        aria-label="Assessment progress"
      >
        <div class="assessment-progress__meta d-flex align-items-baseline justify-content-between">
          <span>Your journey</span>
          <strong>{{ displayedProgress() }}%</strong>
        </div>
        <div
          class="assessment-progress__track overflow-hidden"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-valuenow]="displayedProgress()"
        >
          <span
            class="assessment-progress__fill d-block h-100"
            [style.width.%]="animatedProgress()"
          ></span>
        </div>
      </section>
    }

    <div class="step-viewport d-flex">
      <router-outlet />
    </div>
  </main>
</div>
